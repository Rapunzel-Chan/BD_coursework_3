[tool.poetry]
name = "bd-course-work3"
version = "0.1.0"
description = ""
authors = ["Rapunzel <osina_kv@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.3"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.1"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.2.0"
mypy = "^1.15.0"
isort = "^6.0.1"
black = "^25.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.report]
exclude_also = [
    'if __name__ == .__main__.:'
]

[tool.isort]
line_length = 119

[tool.black]
line-length = 119
exclude = ".git"
